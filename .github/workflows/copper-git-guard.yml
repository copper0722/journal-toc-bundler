name: Copper Git Boundary Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copper-git-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-git-boundary:
    name: Scan every outgoing Git blob
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # pull_request_target intentionally checks out untrusted head bytes as
          # data only. The workflow executes the trusted base scanner/config,
          # exposes no secrets, and has a read-only token.
          allow-unsafe-pr-checkout: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Scan exact changed Git objects
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          COPPER_GIT_GUARD_EXPECTED_REPOSITORY: ${{ github.repository }}
          COPPER_GIT_GUARD_EXPECTED_VISIBILITY: ${{ github.event.repository.visibility }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          RECEIPT="$RUNNER_TEMP/copper-git-guard.json"
          SARIF="$RUNNER_TEMP/copper-git-guard.sarif"
          SCANNER="$RUNNER_TEMP/copper_git_guard.py"
          CONFIG="$RUNNER_TEMP/copper-git-guard.toml"
          TRUSTED_REF=""
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            TRUSTED_REF="${PR_BASE_SHA:-}"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            TRUSTED_REF="$BEFORE_SHA"
          elif git rev-parse --verify "origin/$DEFAULT_BRANCH" >/dev/null 2>&1; then
            TRUSTED_REF="origin/$DEFAULT_BRANCH"
          fi

          # Never let the object under review replace the scanner that judges it.
          # The sole bootstrap exception is the first installation, when no trusted
          # parent/default-branch projection exists yet; that rollout is manual.
          if [[ -n "$TRUSTED_REF" ]] && git cat-file -e "$TRUSTED_REF:.github/copper-git-guard/copper_git_guard.py" 2>/dev/null; then
            git show "$TRUSTED_REF:.github/copper-git-guard/copper_git_guard.py" > "$SCANNER"
          else
            cp .github/copper-git-guard/copper_git_guard.py "$SCANNER"
            echo "::warning::bootstrap scanner: no trusted prior projection exists"
          fi
          if [[ -n "$TRUSTED_REF" ]] && git cat-file -e "$TRUSTED_REF:.copper-git-guard.toml" 2>/dev/null; then
            git show "$TRUSTED_REF:.copper-git-guard.toml" > "$CONFIG"
          else
            cp .copper-git-guard.toml "$CONFIG"
          fi
          chmod 700 "$SCANNER"
          COMMON=(--repo "$GITHUB_WORKSPACE" --config "$CONFIG" --receipt "$RECEIPT" --sarif "$SARIF")

          if [[ "$EVENT_NAME" == "pull_request_target" && -n "${PR_BASE_SHA:-}" && -n "${PR_HEAD_SHA:-}" ]]; then
            python "$SCANNER" "${COMMON[@]}" range --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "${BEFORE_SHA:-}" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            python "$SCANNER" "${COMMON[@]}" range --base "$BEFORE_SHA" --head "$HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" && "${BEFORE_SHA:-}" =~ ^0+$ ]]; then
            # New branch/tag: scan only commits newly reachable relative to the
            # default branch, not unrelated --all history.
            if BASE_SHA="$(git merge-base "$HEAD_SHA" "origin/$DEFAULT_BRANCH" 2>/dev/null)"; then
              python "$SCANNER" "${COMMON[@]}" range --base "$BASE_SHA" --head "$HEAD_SHA"
            else
              python "$SCANNER" "${COMMON[@]}" range --base "0000000000000000000000000000000000000000" --head "$HEAD_SHA"
            fi
          else
            python "$SCANNER" "${COMMON[@]}" tree --ref "$HEAD_SHA"
          fi
          if [[ "$EVENT_NAME" == "push" && "$GIT_REF" == refs/tags/* ]]; then
            python "$SCANNER" "${COMMON[@]}" tree --ref "$GIT_REF"
          fi

      - name: Upload redacted scan receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: copper-git-guard-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/copper-git-guard.json
            ${{ runner.temp }}/copper-git-guard.sarif
          if-no-files-found: error
          retention-days: 14
